name: Build GDH for Android

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - Android32
          - Android64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 7zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download FFmpeg libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/ffmpeg libs
          curl --fail --location --retry 3 \
            -o .cache/ffmpeg/ffmpeg.7z \
            "https://gitlab.com/tobyadd/ffmpeg-android-x264-dev/-/releases/build/downloads/ffmpeg.7z"
          7z x .cache/ffmpeg/ffmpeg.7z -olibs -y

      - name: Verify FFmpeg libraries
        shell: bash
        run: |
          set -e
          ABI="arm64-v8a"
          if [ "${{ matrix.target }}" = "Android32" ]; then
            ABI="armeabi-v7a"
          fi
          test -f "libs/ffmpeg/$ABI/libavcodec/libavcodec.a"
          test -f "libs/ffmpeg/$ABI/libavformat/libavformat.a"
          test -f "libs/ffmpeg/$ABI/x264/libx264.a"

      - name: Build GDH
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GDH-${{ matrix.target }}
          path: |
            **/*.geode
          if-no-files-found: warn
